/**:
  ros__parameters:
    loop_rate_hz: 20.0
    # 이 시간 동안 gamecontroller 데이터가 안 오면 INITIAL 로 간주하고 정지
    gamecontrol_timeout_sec: 2.0

    topics:
      gamecontrol_sub: "gamecontroldata"
      imu_sub: "Imu"
      master2ik_pub: "master2ik"
      kick_flag_pub: "kick_flag"
      motion_operator_pub: "motion_operator"
      motion_end_sub: "motion_end"
      vision_sub: "/vision/obstacles"

    # 방향별 보행 명령 (master2ik 단위). ik_walk 파라미터 파일의 Tuning_Side(-1.5)가 y 에 추가로 더해짐
    # 좌횡진이 약하면 walk.left.y 를 키우고, 직진 중 옆으로 밀리면 walk.straight.y 로 상쇄
    # 주의: |y| >= 10 이면 ik_walk 가 보행 주기를 줄이는 모드로 들어감
    avoid_dist_m: 0.75   # row 0 이 이보다 가까울 때만 피함 (멀면 직진). 전진 감속에 몇 걸음 걸리니 판 아랫변이 보일 때(>0.42m) 옆걸음을 끝낼 만큼 여유

    walk:
      straight: {x: 10.0, y: 0.0, yaw: 0.0}
      left:     {x: 0.0,  y: 9.5, yaw: 0.0}   # Tuning_Side -1.5 포함 실효 +8.0
      right:    {x: 0.0,  y: -6.5, yaw: 0.0}  # Tuning_Side -1.5 포함 실효 -8.0 (좌우 대칭)
