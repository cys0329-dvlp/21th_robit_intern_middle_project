line_vision:
  ros__parameters:
    image_topic: "/camera1/camera/compressed_image"   # 이름만 compressed, 실제는 sensor_msgs/Image bgr8
    camera_info_topic: "/camera1/info"
    field_lines_topic: "/vision/field_lines"
    debug_image_topic: "/vision/line_debug_image"

    show_window: true      # imshow 창
    image_path: ""         # 사진 경로 넣으면 사진들로 테스트

    model:
      path: ""             
      device: "CPU"        
      num_threads: 0       
      row_anchor_top: 0.03 
      min_points: 4        

    camera:                # obstacle_vision.yaml 과 같은 값으로 맞출 것
      height: 0.60
      tilt_deg: 27.0
      use_distortion: true 
      fallback:            # camera_info 가 안 올 때만
        width: 640.0
        fx: 471.953641
        fy: 476.574144
        cx: 309.509126
        cy: 228.222101

    fit:
      max_range: 3.0       # 이보다 먼 바닥 점은 버림 
      min_points: 4        # 직선 맞춘 뒤 남은 점이 이보다 적으면 못 찾은 걸로
      min_length: 0.3      
      outlier_m: 0.05      

    field:
      width: 1.4           # 경기장 폭 A  field_y 계산용
